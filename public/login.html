<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Orkut - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="text-align: center; margin-top: 50px;">
    <span class="logo">orkut</span>
  </div>
  <div style="width: 320px; margin: 20px auto; background: white; padding: 20px; border: 1px solid #a6b9df;">
    <h3>Aceder ao Orkut</h3>
    <form id="loginForm">
      <label>E-mail:</label>
      <input type="email" id="email" required>
      <label>Senha:</label>
      <input type="password" id="password" required>
      <button type="submit" style="width:100%; margin-top:10px;">Entrar</button>
    </form>
    <p style="font-size: 12px; margin-top: 15px;">Ainda não tem conta? <a href="register.html">Registe-se já</a></p>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('orkut_user', JSON.stringify(data.user));
        window.location.href = 'index.html';
      } else { alert(data.error); }
    });
  </script>
</body>
</html>
